version: "3.9"

services:
 
  fraud-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models          # live model updates without rebuild
      - ./data/processed:/app/data/processed
      - ./mlflow_runs:/app/mlflow_runs
    environment:
      - ENV=production
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
 
  mlflow:
    image: python:3.11-slim
    container_name: mlflow-server
    working_dir: /app
    volumes:
      - ./mlflow_runs:/app/mlflow_runs
    ports:
      - "5000:5000"
    command: >
      bash -c "pip install mlflow -q &&
               mlflow server
               --backend-store-uri sqlite:///mlflow_runs/mlflow.db
               --host 0.0.0.0
               --port 5000"
    restart: unless-stopped

networks:
  default:
    name: fraud-network